<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:tiles="http://www.thymeleaf.org" lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title tiles:fragment="title">Login - ChatMate</title>
    <link type="text/css" rel="stylesheet" th:href="@{/css/default.css}" />
    <link type="text/css" rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/public/favicon.ico}">
</head>

<body>

    <div class="main" tiles:fragment="content">

        <div style="text-align: center; margin-bottom: 2rem;">
            <img th:src="@{/img/public/cm.png}" alt="ChatMate Logo" style="height: 60px; margin-bottom: 1rem;">
            <h1>Welcome Back</h1>
            <h4>Sign in to continue to ChatMate</h4>
        </div>

        <form class="form login-form" name="f" th:action="@{/login}" method="post">
            <fieldset class="fieldset login-fieldset">

                <div th:if="${param.error}" class="alert alert-error">
                    <p>Invalid username or password.</p>
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    <p>You have been successfully logged out.</p>
                </div>

                <div class="form-group field">
                    <input type="email" class="form-field" placeholder="Email Address" name="username" id='username'
                        required autofocus />
                </div>

                <div class="form-group field">
                    <input type="password" class="form-field" placeholder="Password" name="password" id='password'
                        required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="button">Log In</button>
                </div>

                <div class="form-link">
                    <span style="color: var(--text-muted)">Don't have an account?</span> <a href="/register">Sign up</a>
                </div>
            </fieldset>
        </form>
    </div>
</body>

</html>
