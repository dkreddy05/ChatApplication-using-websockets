<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>ChatMate Dashboard</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" />

    <link rel="stylesheet" href="/css/default.css" />
    <link rel="stylesheet" href="/css/chat.css" />
    <link rel="stylesheet" href="/css/style-scrollbar.css" />
    <link type="text/css" rel="stylesheet" href="/css/notifications.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/public/favicon.ico">
</head>

<body>

    <div id="notificationsHub"></div>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="user-profile-section">
                    <div class="avatar-container" id="account-details-button" style="cursor: pointer;">
                        <div class="img_cont_ava">
                            <div class="rectangle" id="avatar-initial">U</div>
                        </div>
                    </div>
                    <div class="user-info-brief">
                        <div id="user-name-header" class="user-name-header">Loading...</div>
                        <div class="user-status">Online</div>
                    </div>
                </div>

                <div class="information-details-container hide">
                    <div class="profile-details-content">
                        <h4>Profile Details</h4>
                        <p class="user-info-text">Name: <span id="user-name"></span></p>
                        <p class="user-info-text">Email: <span id="user-email"></span></p>
                        <p class="user-info-text">Nickname: <span id="user-nickname"></span></p>
                        <form id="nickname-form" name="nickname-form" action="/api/user/">
                            <div class="form-input-group nickname-group">
                                <input id="nickname" type="text" autocomplete="off" placeholder="Change nickname" />
                                <button class="button" id="change-nickname-submit" type="submit">Update</button>
                            </div>
                        </form>
                        <div class="logout-container">
                            <a class="link logout-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="sidebar-search">
                <form id="dm-form" class="search-form">
                    <div class="search-input-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="dm-recipient" placeholder="Search users by nickname..."
                            autocomplete="off">
                    </div>
                    <div id="search-results" class="search-results-dropdown" style="display: none;"></div>
                </form>
            </div>

            <div class="sidebar-chat-list" id="sidebar-chat-list">
                <!-- Global Chat Item -->
                <div class="chat-list-item active" id="chat-item-global" data-recipient="global">
                    <div class="chat-item-avatar global-avatar"><i class="fas fa-globe"></i></div>
                    <div class="chat-item-info">
                        <div class="chat-item-name">Global Chat</div>
                        <div class="chat-item-last-msg" id="global-last-msg">Click to join</div>
                    </div>
                </div>

                <!-- Active Users Section -->
                <div class="sidebar-section-title"
                    style="padding: 10px 15px; font-size: 0.8rem; color: rgba(255,255,255,0.6); text-transform: uppercase; font-weight: bold; margin-top: 5px;">
                    Active Users (<span id="active-users-count">0</span>)
                </div>
                <div id="active-users-list"></div>

                <div class="sidebar-section-title"
                    style="padding: 10px 15px; font-size: 0.8rem; color: rgba(255,255,255,0.6); text-transform: uppercase; font-weight: bold; margin-top: 5px;">
                    Direct Messages
                </div>

                <!-- Dynamic DM Items will be appended here -->
            </div>

            <div class="sidebar-connection-controls">
                <div class="conn-status-indicator" id="conn-status-indicator">
                    <i class="fas fa-circle" style="color: var(--error-color);"></i> Disconnected
                </div>
                <div class="connection-buttons">
                    <form id="connect-form" name="connect-form" style="flex:1;">
                        <button class="button btn-connect" id="startChatButton" type="submit" style="width:100%"><i
                                class="fas fa-plug"></i> Connect</button>
                    </form>
                    <form id="disconnect-form" name="disconnect-form">
                        <button class="button btn-disconnect" id="endChatButton" type="submit"><i
                                class="fas fa-power-off"></i></button>
                    </form>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="main-chat-area">
            <header class="main-chat-header">
                <div class="current-chat-header-info">
                    <div class="current-chat-avatar" id="current-chat-avatar"><i class="fas fa-globe"></i></div>
                    <div class="current-chat-details">
                        <h2 id="current-chat-name">Global Chat Room</h2>
                        <span id="current-chat-status" class="chat-status">Offline</span>
                    </div>
                </div>
            </header>

            <div class="chat-body" id="chat-body">
                <!-- Background pattern common in Telegram -->
                <div class="chat-background"></div>
                <div id="chat" class="message-list">
                    <!-- Chat messages appended here -->
                </div>
            </div>

            <footer class="main-chat-footer">
                <form id="message-controls" name="message-controls" class="message-input-form">
                    <div class="message-input-container">
                        <button type="button" class="icon-btn attachment-btn"><i class="fas fa-paperclip"></i></button>
                        <textarea id="message" placeholder="Write a message..." required rows="1"></textarea>
                        <button type="button" class="icon-btn emoji-btn"><i class="far fa-smile"></i></button>
                    </div>
                    <button class="send-message-btn" type="submit">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.4.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/notifications-script.js"></script>
    <script src="/js/dashboard-script.js"></script>

</body>

</html>
