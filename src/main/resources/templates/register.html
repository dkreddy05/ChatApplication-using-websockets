<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:tiles="http://www.thymeleaf.org" lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title tiles:fragment="title">Register - ChatMate</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <link type="text/css" rel="stylesheet" th:href="@{/css/default.css}" />
  <link type="text/css" rel="stylesheet" th:href="@{/css/forms.css}" />
  <link type="text/css" rel="stylesheet" th:href="@{/css/notifications.css}" />
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/public/favicon.ico}">
</head>

<body>

  <div id="notificationsHub"></div>

  <div class="main" tiles:fragment="content">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1>Create an Account</h1>
      <h4>Join ChatMate and start connecting</h4>
    </div>

    <form id="registration-form" class="form register-form" name="registration-form" th:action="@{/api/registration/}">
      <fieldset class="fieldset registration-fieldset">
        <div th:if="${param.error}" class="alert alert-error">
          <p>Invalid input data.</p>
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
          <p>You have been logged out.</p>
        </div>

        <div class="form-row">
          <div class="form-column">
            <div class="form-group field">
              <input type="text" class="form-field" placeholder="First Name" name="firstname" id='firstname' required
                autofocus />
            </div>
            <div class="form-group field">
              <input type="text" class="form-field" placeholder="Last Name" name="lastname" id='lastname' required />
            </div>
            <div class="form-group field">
              <input type="text" class="form-field" placeholder="Nickname" name="nickname" id='nickname' required />
            </div>
          </div>

          <div class="form-column">
            <div class="form-group field">
              <input type="email" class="form-field" placeholder="Email Address" name="mail" id='mail' required />
            </div>
            <div class="form-group field">
              <input type="password" class="form-field" placeholder="Password" name="password" id='password' required />
            </div>
            <div class="form-group field">
              <input type="password" class="form-field" placeholder="Confirm Password" name="confirm_password"
                id='confirm_password' required />
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="button">Sign Up</button>
        </div>

        <div class="form-link">
          <span style="color: var(--text-muted)">Already have an account?</span> <a href="/login">Sign in</a>
        </div>
      </fieldset>
    </form>
  </div>

  <script src="/js/notifications-script.js"></script>
  <script src="/js/register-script.js"></script>
</body>

</html>
